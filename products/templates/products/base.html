<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Product CRUD{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            color: #1f2937;
        }
        .topbar {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 16px 24px;
        }
        .topbar-inner, .container {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
        }
        .topbar-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }
        .brand { font-weight: 700; font-size: 20px; }
        .container { padding: 28px 0 40px; }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }
        h1 { margin: 0; font-size: 28px; }
        h2 { margin-top: 0; }
        .muted { color: #6b7280; font-size: 14px; }
        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }
        .card-body { padding: 22px; }
        .btn {
            display: inline-block;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 9px 14px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
            line-height: 1.2;
        }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-secondary { background: #fff; color: #374151; border-color: #d1d5db; }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-sm { padding: 7px 10px; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 13px 14px; text-align: left; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
        th { background: #f9fafb; font-size: 13px; color: #4b5563; }
        tbody tr:last-child td { border-bottom: 0; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-top: 1px solid #e5e7eb;
        }
        .pagination-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
        .page-number.active { background: #2563eb; color: #fff; border-color: #2563eb; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }
        .form-group { display: flex; flex-direction: column; gap: 7px; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-weight: 600; font-size: 14px; }
        input, textarea {
            width: 100%;
            padding: 10px 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font: inherit;
            background: #fff;
        }
        input:focus, textarea:focus { outline: 2px solid #bfdbfe; border-color: #2563eb; }
        .form-actions { margin-top: 20px; display: flex; gap: 10px; }
        .field-error { color: #b91c1c; font-size: 13px; min-height: 16px; }
        .loading, .empty { padding: 28px; text-align: center; color: #6b7280; }
        @media (max-width: 720px) {
            .page-header, .topbar-inner, .pagination { align-items: flex-start; flex-direction: column; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: auto; }
            body { font-size: 14px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">Product CRUD</div>
            <a class="btn btn-secondary" href="{% url 'product-list-page' %}">Product List</a>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
